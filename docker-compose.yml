version: "3.9"

services:

  mysql:
    image: mysql:8.0

    restart: always

    environment:
      MYSQL_DATABASE: classavo
      MYSQL_ROOT_PASSWORD: password

    volumes:
      - mysql_data:/var/lib/mysql

  backend:
    build: ./Backend

    ports:
      - "8000:8000"

    env_file:
      - ./Backend/config/.env

    depends_on:
      - mysql

  frontend:
    build: ./Frontend/frontend

    ports:
      - "5173:5173"

    depends_on:
      - backend

volumes:
  mysql_data:


